[package]
name = "calendar-tauri"
version = "0.4.1"
description = "日历 · 任务 · 打卡 —— 本地优先的桌面日历应用"
authors = ["Calendar Team"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "calendar_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

png = "0.17" # 解码托盘图标（已在依赖树中，不增加编译量）

# 打包体积优化：LTO + strip + 尺寸优先
[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
incremental = false
